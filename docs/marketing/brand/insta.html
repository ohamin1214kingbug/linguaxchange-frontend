<!doctype html>
<!-- Colourful profile pictures for Instagram, three variants picked with ?v=a|b|c
     (?v=sheet shows all three cropped to circles, as Instagram shows them).
     The mark's navy background is keyed out on a canvas, so the monkey-L sits
     on any colour. Render 1080x1080:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
         --force-device-scale-factor=1 --virtual-time-budget=10000 --window-size=1080,1080 \
         --screenshot=docs/marketing/brand/insta-a.png "file://$PWD/docs/marketing/brand/insta.html?v=a" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GongbuLeng Instagram pictures</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: #fff; }
  .pic { position: relative; width: 1080px; height: 1080px; overflow: hidden; display: none; }
  .mark { position: absolute; }
  /* Sticker look: a navy outline (four hard shadows) and the site's offset shadow. */
  .sticker { filter: drop-shadow(10px 0 0 #1a1a2e) drop-shadow(-10px 0 0 #1a1a2e) drop-shadow(0 10px 0 #1a1a2e) drop-shadow(0 -10px 0 #1a1a2e) drop-shadow(18px 18px 0 #1a1a2e); }

  /* A: rays in the seven language colours, cream disc behind the mark. */
  #a { background: conic-gradient(from -12deg, #4361ee 0 51.4deg, #da1f33 0 102.8deg, #f4a623 0 154.2deg, #7b2cbf 0 205.6deg, #3ec46d 0 257deg, #2ec4b6 0 308.4deg, #f4696e 0 360deg); }
  #a .disc { position: absolute; left: 150px; top: 150px; width: 780px; height: 780px; border-radius: 50%; background: #fdf3e7; border: 14px solid #1a1a2e; }
  #a .mark { left: 305px; top: 262px; width: 480px; }

  /* B: brand blue, sticker mark, small dots in the other colours. */
  #b { background: #4361ee; }
  #b .mark { left: 272px; top: 236px; width: 520px; }
  .dot { position: absolute; border-radius: 50%; border: 8px solid #1a1a2e; }

  /* C: brand yellow, sticker mark, a red banana-coloured ring. */
  #c { background: #f4a623; }
  #c .ring { position: absolute; left: 130px; top: 130px; width: 820px; height: 820px; border-radius: 50%; border: 26px dashed #da1f33; }
  #c .mark { left: 282px; top: 246px; width: 500px; }

  #sheet { display: none; padding: 40px; gap: 40px; font-family: Inter, system-ui, sans-serif; color: #1a1a2e; }
  #sheet figure { text-align: center; font-size: 28px; font-weight: 700; }
  #sheet img { width: 300px; height: 300px; border-radius: 50%; display: block; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="pic" id="a"><div class="disc"></div><img class="mark" alt=""></div>
<div class="pic" id="b">
  <span class="dot" style="left:175px;top:195px;width:110px;height:110px;background:#f4a623"></span>
  <span class="dot" style="left:785px;top:215px;width:90px;height:90px;background:#da1f33"></span>
  <span class="dot" style="left:180px;top:760px;width:80px;height:80px;background:#3ec46d"></span>
  <span class="dot" style="left:790px;top:760px;width:110px;height:110px;background:#f4696e"></span>
  <img class="mark sticker" alt="">
</div>
<div class="pic" id="c"><div class="ring"></div><img class="mark sticker" alt=""></div>
<div id="sheet"></div>

<script>
  const v = new URLSearchParams(location.search).get('v') || 'a'
  const NAVY = [26, 26, 46]
  const src = new Image()
  src.onload = () => {
    // The source has stray white lines on its last 8px, so it is cut to 1080.
    const c = document.createElement('canvas')
    c.width = c.height = 1080
    const x = c.getContext('2d')
    x.drawImage(src, 0, 0)
    const img = x.getImageData(0, 0, 1080, 1080), d = img.data
    // Only navy connected to the picture edge is background: the eyes are
    // nearly as dark, and keying by colour alone punched holes through them.
    const W = 1080, dist = i => Math.hypot(d[i] - NAVY[0], d[i + 1] - NAVY[1], d[i + 2] - NAVY[2])
    const bg = new Uint8Array(W * W), stack = []
    for (let k = 0; k < W; k++) stack.push(k, (W - 1) * W + k, k * W, k * W + W - 1)
    while (stack.length) {
      const p = stack.pop()
      if (bg[p] || dist(p * 4) > 88) continue
      bg[p] = 1
      const px = p % W, py = (p - px) / W
      if (px > 0) stack.push(p - 1); if (px < W - 1) stack.push(p + 1)
      if (py > 0) stack.push(p - W); if (py < W - 1) stack.push(p + W)
    }
    for (let i = 0; i < d.length; i += 4) {
      const a = bg[i / 4] ? Math.min(1, Math.max(0, (dist(i) - 18) / 70)) : 1
      // Edge pixels are part navy; take the navy back out of their colour.
      for (let k = 0; k < 3; k++) d[i + k] = a ? Math.min(255, Math.max(0, (d[i + k] - (1 - a) * NAVY[k]) / a)) : 0
      d[i + 3] = Math.round(a * 255)
    }
    x.putImageData(img, 0, 0)
    // Trim to the mark itself so each layout positions the shape, not empty space.
    const t = document.createElement('canvas')
    t.width = 760; t.height = 840
    t.getContext('2d').drawImage(c, 160, 110, 760, 840, 0, 0, 760, 840)
    const url = t.toDataURL()
    document.querySelectorAll('.mark').forEach(m => (m.src = url))
    if (v === 'sheet') {
      const s = document.getElementById('sheet')
      s.style.display = 'flex'
      // Each variant drawn into a canvas the size of the picture, for the circle preview.
      ;['a', 'b', 'c'].forEach(id => {
        const f = document.createElement('figure')
        f.innerHTML = `<img src="${location.pathname.replace('insta.html', 'insta-' + id + '.png')}">${id.toUpperCase()}`
        s.appendChild(f)
      })
    } else {
      document.getElementById(v).style.display = 'block'
    }
  }
  src.src = '../../../public/icons/l-mark-source.png'
</script>
</body>
</html>
